limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sse_limit:10m rate=5r/s;

upstream backend_api {
    server api:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # 프론트엔드 (Next.js)
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (Rate Limited)
    location /url-reputations/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE 엔드포인트 (버퍼링 비활성화)
    location /url-reputations/analyze-stream {
        limit_req zone=sse_limit burst=5 nodelay;
        
        proxy_pass http://backend_api;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        
        # SSE 핵심 설정
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        
        # 프록시 버퍼링 명시적 비활성화 (Cloudflare 등)
        add_header 'X-Accel-Buffering' 'no';
        
        # CORS
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' '*';
    }

    # Health Check
    location /health/ {
        proxy_pass http://backend_api;
        access_log off;
    }
}
