[package]
name = "aegis-link"
version = "0.1.0"
edition = "2021"

[dependencies]
vespera = "0.1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vespertide = "0.1"
sea-orm = { version = "2.0.0-rc", features = ["runtime-tokio-native-tls", "sqlx-postgres", "macros"] }
anyhow = "1"
tower-http = { version = "0.6.8", features = ["cors"] }
reqwest = { version = "0.13.1", features = ["json"] }
uuid = { version = "1.20.0", features = ["v4"] }
