services:
  # Nginx 리버스 프록시 (모든 요청의 진입점)
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  api:
    build:
      # 빌드 컨텍스트: backend 폴더
      context: ./backend
      # Dockerfile 위치: backend/Dockerfile
      dockerfile: Dockerfile
    restart: always
    expose:
      - 8000
    environment:
      # PostgreSQL 연결 URL
      # postgres:5432 - Docker Compose 내부 네트워크에서 postgres 서비스 참조
      - DATABASE_URL=postgresql://aegis_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aegis_link_db
      # 포트 설정
      - PORT=8000
    # PostgreSQL이 준비된 후에 API 시작
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -q --spider http://api:8000/health/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s # Rust 빌드 시간 고려
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  ai:
    build:
      context: ./react-ai
      dockerfile: Dockerfile
    restart: always
    expose:
      - 8001
    ports:
      - "8001:8001"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    healthcheck:
      # python:slim 이미지에는 wget이 없으므로 Python urllib 사용
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "3.0" # AI 추론 작업에 가장 많은 코어 할당
          memory: 4G
        reservations:
          cpus: "1.5"
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /
    restart: always
    expose:
      - 3000
    environment:
      # 클라이언트 사이드 (브라우저)에서 사용 - 상대 경로로 Nginx 경유
      - NEXT_PUBLIC_API_BASE_URL=/
      # 서버 사이드 (Server Components)에서 사용
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Search-AI: 지능형 도메인 홉 크롤러
  search-ai:
    build:
      context: ./search-ai
      dockerfile: Dockerfile
    restart: "no" # 크롤링 완료 후 종료 (수동 실행용)
    environment:
      # Docker 내부 네트워크 주소 사용
      - REACT_AI_URL=http://ai:8001
      - BACKEND_URL=http://api:8000
      - SEEDS_DIR=/app/seeds
      - MAX_URLS=500
      # 정적 데이터 적재 건너뛰기 (이미 적재했다면)
      # - SKIP_STATIC_IMPORT=true
    volumes:
      # seeds 디렉토리 마운트 (읽기 전용)
      - ./search-ai/seeds:/app/seeds
      # logs 디렉토리 마운트 (영구 저장)
      - ./search-ai/logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G # 크롤링 시 대량 데이터 처리
        reservations:
          cpus: "1.0"
          memory: 1G

  # PostgreSQL 데이터베이스 서비스
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      # 데이터베이스 이름
      POSTGRES_DB: aegis_link_db
      # 사용자 이름
      POSTGRES_USER: aegis_user
      # 비밀번호 (환경변수로 받음)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      # 데이터 영속성: 컨테이너가 삭제되어도 데이터 보존
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 외부에서 접근 가능하도록 포트 노출 (개발용)
      # 로컬 PC의 5432 포트가 이미 사용 중(Homebrew Postgres)이므로 5433으로 변경
      - "5433:5432"
    healthcheck:
      # PostgreSQL이 준비되었는지 확인
      test: ["CMD-SHELL", "pg_isready -U aegis_user -d aegis_link_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

# 볼륨 정의 (데이터 저장소)
volumes:
  postgres_data: # Docker가 관리하는 영구 저장소
